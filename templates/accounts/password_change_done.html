{% extends "base.html" %}
{% load static %}

{% block title %}Contraseña actualizada | Lotería Binaria{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-9 col-lg-6">
        <section class="card shadow-sm" aria-labelledby="password-done-title">
            <div class="card-body p-4 p-lg-5 text-center">
                <span class="badge text-bg-success mb-3">Actualización completada</span>
                <h1 id="password-done-title" class="h2 mb-3">
                    Contraseña actualizada
                </h1>
                <p class="text-body-secondary mb-4">
                    Tu contraseña fue cambiada de forma segura y tu sesión continúa activa.
                </p>
                <a class="btn btn-primary" href="{% url 'accounts:profile' %}">
                    Volver a mi perfil
                </a>
            </div>
        </section>
    </div>
</div>
{% endblock %}
